name: Phobos Engrave Win32 build probe
on:
  push:
    branches:
      - phobos-engrave-win32-build
  workflow_dispatch:
jobs:
  toolchain:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Check Windows MSVC toolchain
        shell: pwsh
        run: |
          Write-Host "OS=$env:RUNNER_OS"
          Write-Host "ARCH=$env:RUNNER_ARCH"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            & $vswhere -latest -products * -property installationPath
          }
          Get-Command msbuild.exe -ErrorAction SilentlyContinue | Format-List
          Write-Host "Windows compiler probe complete"
