name: Phobos Engrave Build48 experimental Win32
on:
  push:
    branches:
      - phobos-engrave-win32-build
  workflow_dispatch:

jobs:
  engrave-win32:
    runs-on: windows-2022
    permissions:
      contents: read
    steps:
      - name: Checkout Phobos Build 48 and YRpp submodules
        uses: actions/checkout@v4
        with:
          repository: Phobos-developers/Phobos
          ref: build-48
          submodules: recursive
          fetch-depth: 0
          path: phobos

      - name: Check compiler, SDK and submodules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          & $vswhere -latest -products * -property installationPath
          Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\Include" | Select-Object -Last 3
          Push-Location phobos
          git submodule status
          Pop-Location

      - name: Download and apply the historical PR 1293 patch to Build 48
        id: apply-pr
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location phobos
          Invoke-WebRequest "https://github.com/Phobos-developers/Phobos/pull/1293.diff" -OutFile "$env:RUNNER_TEMP\engrave-1293.diff"
          $diff = Get-Item "$env:RUNNER_TEMP\engrave-1293.diff"
          Write-Host "Downloaded PR patch: $($diff.Length) bytes"
          git apply --3way --whitespace=nowarn "$env:RUNNER_TEMP\\engrave-1293.diff"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "Resolve known Build48/PR conflicts; preserve the Build48 consolidated FLH hook."
            $expected = @(
              'CREDITS.md',
              'docs/New-or-Enhanced-Logics.md',
              'docs/Whats-New.md',
              'src/Ext/Techno/Hooks.Firing.cpp'
            )
            $unmerged = @(git diff --name-only --diff-filter=U)
            Write-Host "Unmerged: $($unmerged -join ', ')"
            foreach ($path in $unmerged) {
              if ($path -notin $expected) { throw "Unexpected PR conflict in $path" }
              git checkout --ours -- $path
              if ($LASTEXITCODE -ne 0) { throw "Unable to restore Build48 version of $path" }
              git add -- $path
            }
            $hookPath = "src/Ext/Techno/Hooks.Firing.cpp"
            $text = [System.IO.File]::ReadAllText((Resolve-Path $hookPath))
            $needle = '*pCoords = TechnoExt::GetFLHAbsoluteCoords(pThis, flh, allowOnTurret);'
            $matches = [regex]::Matches($text, [regex]::Escape($needle))
            if ($matches.Count -ne 1) { throw "Build48 consolidated FLH hook no longer matches" }
            $replacement = 'if (auto const pExt = TechnoExt::ExtMap.TryFind(pThis))' + "`r`n" +
              "`t`tpExt->LastWeaponFLH = flh;" + "`r`n`t" + $needle
            $text = $text.Replace($needle, $replacement)
            [System.IO.File]::WriteAllText((Resolve-Path $hookPath), $text)
            git add -- $hookPath
          }
          $remaining = @(git diff --name-only --diff-filter=U)
          if ($remaining.Count -ne 0) { throw "Unresolved conflicts remain" }
          git add -A
          # PR 1293 predates the Build48 MapClass::Instance reference migration.
          $engravePath = "src/Ext/Bullet/Trajectories/EngraveTrajectory.cpp"
          $engraveSource = [System.IO.File]::ReadAllText((Resolve-Path $engravePath))
          $oldCount = ([regex]::Matches($engraveSource, "MapClass::Instance->")).Count
          Write-Host "Migrating $oldCount old MapClass::Instance pointer accesses"
          if ($oldCount -lt 2) { throw "Engrave MapClass usage changed; review manually" }
          $engraveSource = $engraveSource.Replace("MapClass::Instance->", "MapClass::Instance.")
          [System.IO.File]::WriteAllText((Resolve-Path $engravePath), $engraveSource)
          git add -- $engravePath
          git status --short
          Pop-Location

      - name: Compile Win32 Release DLL
        if: success()
        shell: cmd
        run: |
          cd phobos
          call scripts\build_release.bat

      - name: Upload compiled Release DLL + optional PDB
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Phobos-Build48-Engrave-Release-experimental
          path: |
            phobos/Release/Phobos.dll
            phobos/Release/Phobos.pdb
          if-no-files-found: error
